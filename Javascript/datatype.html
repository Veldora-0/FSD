<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="ad"></p>
    <script>
        const a=10;
        //  const a=20; // const cannot be redeclared and updated
        document.write(a);
        var b = 10;
        var b = 20; // var can be redeclared and updated
        document.write(b);
        let c=10;
        // let c=20; // let cannot be redeclared but can be updated
        c=20;
        document.write(c);
        
        
    </script>
</body>

</html>
