<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login</title>
   <link rel="stylesheet" href="style.css">
   <script src="storage.js"></script>
   <script src="login.js"></script>
</head>

<body>
   <header>
      <h1>Login</h1>
   </header>

   <main>
      <form id="login-form" novalidate>
         <div id="status-message" class="status-message" role="status" aria-live="polite" hidden></div>

         <div class="form-group">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" name="login-email" placeholder="you@example.com" required>
            <div class="field-error" id="login-email-error" aria-live="polite"></div>
         </div>

         <div class="form-group">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" name="login-password" placeholder="Enter your password" required>
            <div class="field-error" id="login-password-error" aria-live="polite"></div>
         </div>

         <div class="buttons">
            <input type="submit" value="Login">
         </div>

         <div class="auth-link-wrap">
            <a href="index.html" class="auth-link">Create an account</a>
         </div>
      </form>

      <section id="user-details" class="details-card" hidden>
         <h2>Saved Details</h2>
         <div id="details-content"></div>
      </section>
   </main>
</body>

</html>
