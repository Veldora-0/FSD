 functionality when click on buy now by onclick

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .container {
            border: 2px solid black;
            height: 300px;
            width: 300px;
        }

        header {
            text-align: center;
            padding: 9px;
        }
    </style>
    
    <div class="container">
        <header>
            <h1>Online Shop</h1>
        </header>
        <ul>
            <li>Rice 500</li>
            <li>Tea 700</li>
            <li>Coffie 800</li>
            <li>Sugar 62</li>
        </ul>
        <button onclick="buyNow()">Buy Now</button>

    <script>
        
        const products = {
            Rice: 500,
            Tea: 700,
            Coffie: 800,
            Sugar: 62
        };

        function buyNow() {
            const productName = prompt("Enter your product name:");
            const quantity = parseFloat(prompt("Enter your quantity (in Kg):"));

            if (products[productName] && !isNaN(quantity)) {
                const totalAmount = products[productName] * quantity;
                document.write(`Your total amount is ${totalAmount} <br>`);
                document.write(`<img src="${productName.toLowerCase()}.jpg" alt="${productName}" width="100">`);
            } else {
                document.write("Invalid product name or quantity.");
            }
        }
    </script>

</body>

</html>
